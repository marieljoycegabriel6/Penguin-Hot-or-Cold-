:root{
  --z:1;
  --font:"Fredoka","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --paper:#fbf3e3; --ink:#4a3b31; --ink2:#8a6a52; --ink3:#a0785a;
  --accent:#e2725b; --accentShadow:#f6c9a8; --cream:#fff7ea; --peach:#ffe8c9;
  --hot:#f28b6b; --cold:#6fb4e6; --good:#8cc084; --bad:#e57e7e; --next:#8d9ad6; --pick:#b892d6; --speak:#f7c65a;
  --clay:inset 0 .5rem .8rem rgba(255,255,255,.7),inset 0 -.65rem 1.1rem rgba(120,80,50,.17),inset .4rem 0 .9rem rgba(255,255,255,.25),0 .35rem .6rem rgba(90,60,40,.10),0 1rem 2rem rgba(90,60,40,.15);
}
html{font-size:calc(16px * var(--z))}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:#bfe4f4;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;-webkit-tap-highlight-color:transparent}

/* ---------- WORLD (full screen) ---------- */
#world{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.flake{position:absolute;top:-3rem;font-size:1.9rem;animation:fall linear forwards}
.drop{position:absolute;font-size:1.6rem;opacity:0;animation:drip 1.1s ease-in forwards}

/* ---------- HUD ---------- */
#hud{position:fixed;top:.6rem;left:.6rem;right:.6rem;z-index:5;display:flex;align-items:center;gap:.6rem;padding:.4rem .7rem;border-radius:1.6rem;background:rgba(255,232,201,.93);box-shadow:var(--clay);flex-wrap:wrap}
#hud .t{font-weight:700;font-size:1.35rem;color:var(--accent);flex:1;min-width:8rem;white-space:nowrap}
.s-home #hud{background:transparent;box-shadow:none;justify-content:flex-end;left:auto}
.s-home .gameOnly{display:none!important}
.s-settings #hud{display:none}
.iconBtn{background:var(--cream);border-radius:1rem;font-size:1.15rem;font-weight:600;min-width:2.7rem;height:2.6rem;padding:0 .65rem;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;box-shadow:var(--clay);white-space:nowrap}
.iconBtn svg{width:1.3rem;height:1.3rem}
.iconBtn.on{background:#d5ecc9}

.pill{background:var(--cream);border-radius:999px;padding:.2rem .9rem;font-weight:600;font-size:1.1rem;box-shadow:var(--clay)}
.meter{display:flex;align-items:center;gap:.4rem;font-weight:600;font-size:1.05rem}

/* ---------- FLOATING SHEETS ---------- */
.overlay{position:fixed;z-index:4;right:1rem;top:4.6rem;bottom:1rem;width:min(30rem,44vw);display:none}
.s-home #homeWrap{display:flex;top:4rem}
.s-game #panelWrap{display:flex}
@media (max-aspect-ratio:1/1){
  .overlay{left:.7rem;right:.7rem;width:auto;top:auto!important;height:54vh;bottom:.7rem}
  #panel{justify-content:center}
  .s-home #homeWrap{height:auto;max-height:60vh}
  #hud .t{flex:0 0 auto;min-width:0;font-size:0}
  #hud .t::first-letter{font-size:1.6rem}
  #hud{justify-content:space-between}
}
.sheet{position:relative;flex:1;min-height:0;background:rgba(255,250,242,.95);border-radius:2rem;box-shadow:var(--clay);padding:1rem 1.2rem;display:flex;flex-direction:column;align-items:center;gap:.7rem;overflow:auto;transition:transform .55s cubic-bezier(.3,1.25,.5,1),opacity .35s}
.bigview #panelWrap .sheet{transform:translateX(115%);opacity:0;pointer-events:none}
@media (max-aspect-ratio:1/1){.bigview #panelWrap .sheet{transform:translateY(115%)}}

/* ---------- HOME ---------- */
.homeSheet{justify-content:center;text-align:center;gap:.6rem}
.homeSheet .storyTag{font-size:1.1rem;color:#b08a6a;font-style:italic;font-weight:600}
.homeSheet h1{margin:0;font-weight:700;color:var(--accent);font-size:clamp(2.2rem,4.2vw,3.6rem);line-height:1;text-shadow:0 .25rem 0 var(--accentShadow),0 .5rem .9rem rgba(90,60,40,.18)}
.homeSheet .sub{font-weight:600;color:#7a9a6b;font-style:italic;font-size:1.5rem}
.label{font-weight:600;font-size:1.25rem;color:var(--ink2);margin-top:.3rem}
.hint{font-size:1rem;color:#a78b74;margin-top:-.4rem;line-height:1.3}
.row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center}
.countBtn{background:var(--cream);border-radius:1.25rem;font-size:1.25rem;font-weight:700;padding:.35rem 1.1rem;box-shadow:var(--clay)}
.countBtn.sel{background:#ffd9a8}
.countBtn.fits::after{content:" ⭐";font-size:.8em}
.bigBtn{font-size:1.9rem;font-weight:700;color:#fff;background:var(--good);padding:.8rem 3.2rem;border-radius:2rem;margin-top:.5rem;box-shadow:var(--clay);text-shadow:0 2px 0 rgba(0,0,0,.12)}
.linkBtn{background:transparent;color:var(--ink3);font-size:1.15rem;font-weight:600;text-decoration:underline}
.bigBtn:active,.btn:active,.countBtn:active{transform:translateY(4px) scale(.97)}

/* ---------- GAME PANEL ---------- */
.who{min-height:3.6rem;display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;align-items:center}
.chip{border-radius:1.5rem;padding:.25rem 1.1rem;font-size:clamp(1.3rem,2.3vw,1.9rem);font-weight:700;background:#ffd6c9;box-shadow:var(--clay);animation:pop .35s ease-out both}
.who .chip:nth-child(2){background:#cfe8c4}.who .chip:nth-child(3){background:#d8d3f5}
.chip.spin{background:#f3e8d6!important;color:#b09a85;animation:none}
.chip.all{background:#cfe8c4!important}

.card{position:relative;height:min(34vh,19rem);aspect-ratio:4/3;max-width:100%;flex-shrink:0;background:#fffaf2;border-radius:2rem;box-shadow:var(--clay);display:flex;flex-direction:column;align-items:center;justify-content:center;container-type:size}
@media (max-aspect-ratio:1/1){.card{height:min(24vh,20rem)}}
.card::before{content:"";position:absolute;top:-.8rem;left:50%;width:7rem;height:1.8rem;transform:translateX(-50%) rotate(-3deg);background:rgba(255,214,140,.75);border-radius:4px;box-shadow:0 2px 3px rgba(0,0,0,.08);z-index:3}
.card .art{font-size:55cqh;line-height:1;filter:drop-shadow(0 8px 6px rgba(90,60,40,.25))}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:2rem}
.card .cap{position:absolute;bottom:.5rem;left:50%;transform:translateX(-50%);background:var(--peach);border-radius:999px;padding:0 1rem;font-weight:700;font-size:clamp(1.1rem,2vw,1.6rem);white-space:nowrap;box-shadow:inset -3px -4px 0 rgba(0,0,0,.08)}
.card .zh{display:block;font-size:.8em;font-weight:600;color:var(--ink3);text-align:center;margin-top:-.3rem}
.card.bonusCard .art{font-size:40cqh}
.card.bonusCard .cap{position:static;transform:none;background:transparent;box-shadow:none;margin-top:.4rem;text-align:center;white-space:normal;line-height:1.15}
.steam{position:absolute;left:44%;top:9cqh;transform:translateX(-50%);width:52cqh;height:34cqh;display:flex;justify-content:space-between;z-index:2;pointer-events:none}
.steam svg{width:28%;height:100%;overflow:visible;fill:none;stroke:#a89b8f;stroke-width:8;stroke-linecap:round;filter:blur(1.2px) drop-shadow(0 0 4px rgba(255,255,255,.95));opacity:0;animation:steam 2.4s ease-in-out infinite}
.steam svg:nth-child(2){animation-delay:.8s;margin-top:-8%}
.steam svg:nth-child(3){animation-delay:1.6s}
@keyframes steam{0%{opacity:0;transform:translateY(25%) scaleX(.8)}30%{opacity:.9}70%{opacity:.7}100%{opacity:0;transform:translateY(-25%) scaleX(1.2)}}
.pthumb{position:relative;container-type:size}
.card .wait{font-size:45cqh;opacity:.5;color:#e2a58a;font-weight:700}
.card.reveal{animation:pop .4s ease-out}
.replay{position:absolute;top:.5rem;right:.5rem;background:var(--peach);border-radius:50%;width:2.9rem;height:2.9rem;font-size:1.35rem;z-index:4;box-shadow:var(--clay)}

.prompt{font-size:clamp(1.35rem,2.3vw,1.85rem);font-weight:600;text-align:center;line-height:1.15;min-height:2.1rem}
.prompt .zh,.feedback .zh,.endBox .zh{display:block;font-size:.75em;color:var(--ink3)}
.speakBanner{font-size:clamp(1.2rem,2vw,1.7rem);font-weight:700;background:#fff1b8;border-radius:1.5rem;padding:.25rem 1rem;text-align:center;box-shadow:var(--clay)}
.ctrl{display:flex;gap:.9rem;flex-wrap:wrap;justify-content:center;align-items:center;min-height:5rem}
.btn{font-size:clamp(1.5rem,2.5vw,2.1rem);font-weight:700;color:#fff;border-radius:1.9rem;padding:.6rem 1.8rem;transition:transform .1s,opacity .2s;box-shadow:var(--clay);text-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn[disabled]{opacity:.35;cursor:default;transform:none}
.btn small{font-size:.65em;font-weight:600;opacity:.95}
.pickBtn{background:var(--pick);font-size:clamp(1.9rem,3.2vw,2.6rem);padding:.6rem 3rem}
.speakBtn{background:var(--speak);color:#5b4320;text-shadow:none;animation:pulse 1.3s ease-in-out infinite}
.hotBtn{background:var(--hot)}.coldBtn{background:var(--cold)}
.goodBtn{background:var(--good)}.badBtn{background:var(--bad)}.nextBtn{background:var(--next)}
.btn.nope{animation:nope .45s ease-in-out}
.feedback{font-size:clamp(1.5rem,2.6vw,2.2rem);font-weight:700;text-align:center;line-height:1.15;animation:pop .35s ease-out}
.feedback.ok{color:#5e9e56}.feedback.no{color:#e0864f}.feedback.try{color:#c98a1c}
.feedback .say{display:block;font-size:.7em;color:var(--ink);margin-top:.3rem}
.turns{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:center;margin-top:auto;padding-top:.4rem}
.turns span{font-size:.85rem;font-weight:600;background:var(--cream);border-radius:99px;padding:0 .55rem;color:#bba58f;box-shadow:inset -2px -3px 0 rgba(0,0,0,.06)}
.turns span.done{background:#d5ecc9;color:#4f8a47}
.endBox{text-align:center;margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:.7rem}
.endBox h2{margin:0;font-size:clamp(2rem,3.8vw,3.2rem);font-weight:700;color:var(--accent);line-height:1;text-shadow:0 .25rem 0 var(--accentShadow)}
.endBox .zh{font-size:clamp(1.3rem,2.4vw,2rem);font-weight:600}
.endBox p{margin:0;font-size:1.35rem;color:var(--ink2)}
.endBox .theEnd{font-style:italic;color:#b08a6a;font-size:clamp(1.25rem,2vw,1.7rem)}

/* ---------- SETTINGS ---------- */
#settings{position:fixed;inset:0;z-index:6;display:none;flex-direction:column;overflow:auto;padding:1rem 1.25rem 2.5rem;background:var(--paper);
  background-image:radial-gradient(rgba(160,120,80,.10) 1px,transparent 1.4px),radial-gradient(rgba(160,120,80,.07) 1px,transparent 1.4px);background-size:22px 22px,13px 13px;background-position:0 0,7px 9px}
.s-settings #settings{display:flex}
#settings h2{margin:.4rem 0 .25rem;color:var(--ink);font-size:2.1rem;font-weight:700}
.tabs{display:flex;gap:.6rem;margin:.5rem 0 .9rem}
.tab{background:#fff;border:3px solid #ead7bb;border-radius:1rem;padding:.25rem 1.1rem;font-size:1.25rem;font-weight:700}
.tab.sel{border-color:var(--accent);background:var(--peach)}
textarea{width:100%;height:26rem;font-family:inherit;font-size:1.25rem;color:var(--ink);border:3px solid #ead7bb;border-radius:1rem;padding:.5rem .75rem;resize:vertical;-webkit-user-select:text;user-select:text}
.sNote{font-size:1rem;color:#a78b74;margin-top:.4rem}
.sBtn{background:var(--ink);color:#fff;font-size:1.2rem;font-weight:700;border-radius:.9rem;padding:.4rem 1.2rem;margin-right:.5rem;margin-top:.75rem}
.sBtn.alt{background:#fff;color:var(--ink);border:3px solid #ead7bb}
.picGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:.75rem}
.pcard{background:#fff;border-radius:1.1rem;padding:.5rem;border:3px solid #f0e2cc;text-align:center}
.pthumb{height:6.25rem;display:flex;align-items:center;justify-content:center;font-size:4rem;border-radius:.75rem;background:#fdf6ea;overflow:hidden}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pname{font-weight:700;font-size:1.1rem;margin-top:.25rem}
.tag{display:inline-block;border-radius:99px;padding:0 .6rem;font-size:.85rem;font-weight:700;color:#fff}
.tag.hot{background:var(--hot)}.tag.cold{background:var(--cold)}
.pbtns{display:flex;gap:.4rem;justify-content:center;margin-top:.4rem;flex-wrap:wrap}
.pbtns button,.pbtns label{font-size:.85rem;font-weight:700;border-radius:.6rem;padding:.2rem .6rem;background:var(--cream);color:var(--ink);cursor:pointer}
.addBox{background:#fff;border:3px dashed #e3c9a4;border-radius:1.1rem;padding:.75rem .9rem;margin:0 0 1rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;font-size:1.1rem;font-weight:600}
.addBox input[type=text]{font-family:inherit;font-size:1.1rem;border:3px solid #ead7bb;border-radius:.75rem;padding:.25rem .6rem;-webkit-user-select:text;user-select:text}
.hc{display:flex;gap:.4rem}
.hc button{font-size:1.05rem;font-weight:700;border-radius:.75rem;padding:.2rem .75rem;background:var(--cream);border:3px solid transparent}
.hc button.sel.h{border-color:var(--hot)}.hc button.sel.c{border-color:var(--cold)}
input[type=file]{display:none}
.toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.5rem 1.25rem;border-radius:.9rem;font-size:1.1rem;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1}

/* ---------- PENGUIN + SCENE ANIMATION ---------- */
#peng{cursor:pointer}
.peng{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite}
.wingL{transform-box:fill-box;transform-origin:85% 10%}
.wingR{transform-box:fill-box;transform-origin:15% 10%}
.eyesN{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.eyesH,.brows,.sweat,.tear{opacity:0;transition:opacity .2s}
.peng.clap .eyesN,.peng.dance .eyesN{opacity:0}
.peng.clap .eyesH,.peng.dance .eyesH{opacity:1}
.peng.worry .brows,.peng.worry .sweat,.peng.worry .tear,.peng.hot .sweat{opacity:1}
.peng.clap .wingL{animation:flapL .22s ease-in-out 6 alternate}
.peng.clap .wingR{animation:flapR .22s ease-in-out 6 alternate}
.peng.clap{animation:hop .45s ease-out 2}
.peng.worry{animation:shake .5s ease-in-out 2}
.peng.dance{animation:dance .8s ease-in-out infinite}
.peng.dance .wingL{animation:flapL .4s ease-in-out infinite alternate}
.peng.dance .wingR{animation:flapR .4s ease-in-out infinite alternate}
.peng.hello .wingR{animation:waveW .45s ease-in-out infinite alternate}
.peng.boing{animation:hop .4s ease-out 1}
#iceG{transform-origin:300px 380px;transition:transform .9s cubic-bezier(.3,1.4,.5,1)}
#sunG{transform-origin:470px 100px;transition:transform .9s ease}
#heat,#cracks,#puddles{transition:opacity .9s}
.sunSpin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
.wave{animation:wave 4s ease-in-out infinite alternate}
.wave2{animation:wave 5s ease-in-out infinite alternate-reverse}
.drift{animation:drift 60s ease-in-out infinite alternate}
.twinkle{animation:twinkle 2.6s ease-in-out infinite}
.fish{opacity:0;transform-box:fill-box;transform-origin:center}
.fish.jump{animation:fishjump 1.3s ease-in-out}
.fish.flip.jump{animation:fishjumpL 1.3s ease-in-out}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-26px)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes dance{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-22px) rotate(-8deg)}75%{transform:translateY(-22px) rotate(8deg)}}
@keyframes flapL{to{transform:rotate(55deg)}}
@keyframes flapR{to{transform:rotate(-55deg)}}
@keyframes waveW{from{transform:rotate(-15deg)}to{transform:rotate(-80deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wave{to{transform:translateX(-40px)}}
@keyframes drift{to{transform:translateX(-260px)}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes fishjump{0%{opacity:0;transform:translate(0,40px) rotate(-55deg)}12%{opacity:1}50%{transform:translate(55px,-95px) rotate(0)}88%{opacity:1}100%{opacity:0;transform:translate(110px,40px) rotate(55deg)}}
@keyframes fishjumpL{0%{opacity:0;transform:translate(0,40px) rotate(55deg) scaleX(-1)}12%{opacity:1}50%{transform:translate(-55px,-95px) rotate(0) scaleX(-1)}88%{opacity:1}100%{opacity:0;transform:translate(-110px,40px) rotate(-55deg) scaleX(-1)}}
@keyframes drip{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(90px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(260deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes nope{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
/* glossy highlight for puffy clay */
.btn,.bigBtn,.chip,.countBtn{position:relative}
.btn::before,.bigBtn::before,.chip::before,.countBtn::before{content:"";position:absolute;left:12%;top:10%;width:36%;height:30%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none}
.sheet{border-radius:2.6rem}
.card,.card img{border-radius:2.4rem}
.btn{border-radius:2.4rem}.bigBtn{border-radius:2.6rem}.countBtn{border-radius:1.6rem}.iconBtn{border-radius:1.3rem}
@media (prefers-reduced-motion:reduce){.drift,.wave,.wave2,.twinkle,.sunSpin{animation:none}}
</style>

<script>
/* ================= DATA ================= */
const DEFAULT_NAMES = ["Bill","Dan","Peter","Greg","Bugatti","Norman","Perry","Anna",
  "Cooper","Hank","Cade","Dylan","Jay","Athena","Cora","Nina","Dorathy","Nana",
  "Willie","Charlie","Alice","Cindy","Elsa","Ariel"];
const BASE_PICS = [
  {id:"sun",emoji:"☀️",name:"the sun",ans:"hot"},
  {id:"fire",emoji:"🔥",name:"fire",ans:"hot"},
  {id:"soup",emoji:"🍲",name:"hot soup",ans:"hot"},
  {id:"tea",emoji:"☕",name:"hot tea",ans:"hot"},
  {id:"volcano",emoji:"🌋",name:"a volcano",ans:"hot"},
  {id:"noodles",emoji:"🍜",name:"hot noodles",ans:"hot"},
  {id:"desert",emoji:"🏜️",name:"the desert",ans:"hot"},
  {id:"potato",emoji:"🍠",name:"a baked sweet potato",ans:"hot",steam:true},
  {id:"icecream",emoji:"🍦",name:"ice cream",ans:"cold"},
  {id:"snowman",emoji:"⛄",name:"a snowman",ans:"cold"},
  {id:"ice",emoji:"🧊",name:"ice",ans:"cold"},
  {id:"snow",emoji:"❄️",name:"snow",ans:"cold"},
  {id:"shavedice",emoji:"🍧",name:"shaved ice",ans:"cold"},
  {id:"mountain",emoji:"🏔️",name:"a snowy mountain",ans:"cold"},
  {id:"snowday",emoji:"🌨️",name:"a snowy day",ans:"cold"},
  {id:"polar",emoji:"🐻‍❄️",name:"the North Pole",ans:"cold"}
];
const BONUS = [
  {emoji:"💡",en:"Turn off the lights",zh:"隨手關燈",good:true},
  {emoji:"🚲",en:"Ride a bike",zh:"騎腳踏車",good:true},
  {emoji:"🚰",en:"Leave the water on",zh:"讓水一直流",good:false},
  {emoji:"♻️",en:"Recycle",zh:"做資源回收",good:true},
  {emoji:"📺",en:"Leave the TV on",zh:"電視一直開著",good:false},
  {emoji:"🌳",en:"Plant a tree",zh:"種樹",good:true},
  {emoji:"🛍️",en:"Use many plastic bags",zh:"用很多塑膠袋",good:false}
];

/* ================= STORAGE ================= */
function load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
let names = load("penguin_class_names") || DEFAULT_NAMES.slice();
let picStore = load("penguin_pics") || {over:{},added:[]};
let sfxOn = load("penguin_sfx") !== false;
function savePics(){ if(!save("penguin_pics",picStore)) toast("Saved for now — but the browser is full, so photos may be gone next time."); }
function allPics(){ return BASE_PICS.map(p=>({...p,img:picStore.over[p.id]||null})).concat(picStore.added); }

/* Turn rotation is saved, so "Play again" (or tomorrow's lesson) continues with students who haven't had a turn yet. */
let turns;
const namesSig=()=>names.join("\n");
function loadTurns(){const t=load("penguin_turns");turns=(t&&t.sig===namesSig()&&Array.isArray(t.pool)&&Array.isArray(t.done))?t:{sig:namesSig(),pool:[],done:[]}}
function saveTurns(){turns.sig=namesSig();save("penguin_turns",turns)}
function resetTurns(){turns={sig:namesSig(),pool:[],done:[]};saveTurns()}
loadTurns();

/* Two students with the same name get a number so each one has their own turn. */
function uniqueNames(list){
  const out=[],used=new Set();
  for(const n of list){let m=n,i=2;while(used.has(m.toLowerCase()))m=`${n} ${i++}`;used.add(m.toLowerCase());out.push(m)}
  return out;
}

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),3000)}
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));voice=vs.find(v=>/Samantha|Google US English|Jenny|Aria|Zira/i.test(v.name))||vs.find(v=>/en-US/i.test(v.lang))||vs[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;u.pitch=1.1;if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){}}
/* Rising steam: shows "hot" in a picture, for students who can't read the label yet */
const WISP=`<svg viewBox="0 0 20 60"><path d="M10 58 C2 48 18 40 10 30 C2 20 18 12 10 2"/></svg>`;
const steamHTML=()=>`<span class="steam" aria-hidden="true">${WISP}${WISP}${WISP}</span>`;
function artHTML(p){return (p.img?`<img src="${p.img}" alt="">`:`<span class="art">${p.emoji||"❓"}</span>`)+(p.steam?steamHTML():"")}

/* ================= SOUND EFFECTS (made in the browser, no files needed) ================= */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==="suspended")AC.resume();return AC}
function tone(f,at,dur,type="sine",vol=.18,slide){
  const a=ac();if(!a)return;const t=a.currentTime+at,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05);
}
const SFX={
  tick:()=>tone(700+Math.random()*500,0,.05,"square",.035),
  pop:()=>tone(420,0,.14,"sine",.2,950),
  good:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.28,"triangle",.17)),
  hmm:()=>{tone(392,0,.16,"triangle",.14);tone(440,.18,.26,"triangle",.14,415)},
  oops:()=>{tone(392,0,.22,"sine",.2,330);tone(311,.2,.4,"sine",.2,220)},
  win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.12,.32,"triangle",.16)),
  squeak:()=>tone(880,0,.16,"square",.05,1600),
  splash:()=>{tone(260,0,.28,"sine",.12,90);tone(1200,.05,.12,"triangle",.04,500)},
  click:()=>tone(600,0,.06,"triangle",.08)
};
function sfx(n){if(sfxOn)try{SFX[n]()}catch(e){}}
function renderSfxBtn(){const b=$("#sfxBtn");b.textContent=sfxOn?"🎵":"🔇";b.classList.toggle("on",sfxOn);b.title=sfxOn?"Sound effects: on":"Sound effects: off"}
$("#sfxBtn").onclick=()=>{sfxOn=!sfxOn;save("penguin_sfx",sfxOn);renderSfxBtn();sfx("click")};
renderSfxBtn();

/* ================= FULL SCREEN ================= */
const root=document.documentElement;
const canFS=!!(root.requestFullscreen||root.webkitRequestFullscreen);
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
const ICON_EXPAND=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>`;
const ICON_SHRINK=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>`;
function renderFS(){const b=$("#fsBtn");if(!canFS){b.style.display="none";return}b.innerHTML=isFS()?ICON_SHRINK:ICON_EXPAND;b.title=isFS()?"Exit full screen":"Full screen"}
$("#fsBtn").onclick=()=>{try{
  if(isFS())(document.exitFullscreen||document.webkitExitFullscreen).call(document);
  else{const p=(root.requestFullscreen||root.webkitRequestFullscreen).call(root);if(p&&p.catch)p.catch(()=>{})}
}catch(e){}};
document.addEventListener("fullscreenchange",renderFS);document.addEventListener("webkitfullscreenchange",renderFS);
renderFS();

/* ================= WORLD LAYOUT ================= */
/* The world fills the screen. Its "stage" (ice + penguin + sun) is centred in whatever space the panel leaves free. */
let state="home", bigView=false, vbCur=null, vbAnim=0, freeR=null;
function freeRect(){
  const W=innerWidth,H=innerHeight;let x=0,y=8,w=W,h=H-8;
  if(state==="game"){const r=$("#hud").getBoundingClientRect();y=r.bottom+6;h=H-y}
  const wrap=state==="home"?$("#homeWrap"):(state==="game"&&!bigView)?$("#panelWrap"):null;
  if(wrap){const r=wrap.getBoundingClientRect();
    if(W/H>1) w=Math.max(220,r.left-8); else h=Math.max(160,r.top-8-y);}
  return {x,y,w,h,W,H};
}
function layoutWorld(animate){
  if(state==="settings")return;
  const f=freeR=freeRect();
  const k=Math.min(f.w/540,f.h/470);
  const target=[300-(f.x+f.w/2)/k, 500-(f.y+f.h)/k, f.W/k, f.H/k];
  const svg=$("#world"), set=v=>svg.setAttribute("viewBox",v.map(n=>n.toFixed(1)).join(" "));
  cancelAnimationFrame(vbAnim);
  if(!animate||!vbCur){vbCur=target;set(target);return}
  const from=vbCur.slice(),t0=performance.now();
  const tick=now=>{let p=Math.min(1,(now-t0)/650);p=1-Math.pow(1-p,3);vbCur=from.map((v,i)=>v+(target[i]-v)*p);set(vbCur);if(p<1)vbAnim=requestAnimationFrame(tick)};
  vbAnim=requestAnimationFrame(tick);
}
function setBig(on){
  bigView=on;document.body.classList.toggle("bigview",on);
  $("#bigBtn").textContent=on?"📋 Cards":"🐧 Big view";$("#bigBtn").classList.toggle("on",on);
  layoutWorld(true);
}
$("#bigBtn").onclick=()=>{sfx("click");setBig(!bigView)};

/* Build background pieces: clouds, icebergs, waves, sparkles */
(function buildWorld(){
  const NS="http://www.w3.org/2000/svg";
  let c="";
  [[-1300,70,1.1],[-820,150,.8],[-420,60,1],[110,85,1],[300,165,.75],[700,60,.95],[1050,140,.8],[1450,80,1.1],[1900,120,.9]].forEach(([x,y,s])=>{
    c+=`<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="6" cy="20" rx="56" ry="9" fill="#cfe3ee" opacity=".55"/>
      <ellipse cx="-22" cy="4" rx="34" ry="16" fill="url(#gCloud)"/><ellipse cx="42" cy="6" rx="24" ry="15" fill="url(#gCloud)"/><ellipse cx="14" cy="-6" rx="32" ry="23" fill="url(#gCloud)"/></g>`;
  });
  $("#clouds").innerHTML=c;
  let b="";
  [[-1500,260,120],[-1150,200,80],[-760,300,140],[-380,180,70],[-40,150,55],[560,170,60],[760,260,110],[1120,210,85],[1460,300,130],[1900,220,90]].forEach(([x,w,h])=>{
    const y=378,p=[[x,y],[x+w*.22,y-h*.65],[x+w*.42,y-h],[x+w*.58,y-h*.72],[x+w*.78,y-h*.86],[x+w,y]];
    b+=`<polygon points="${p.map(q=>q.join(",")).join(" ")}" fill="url(#bergG)"/>`+
       `<polygon points="${[p[2],p[3],p[4],p[5],[x+w*.5,y]].map(q=>q.join(",")).join(" ")}" fill="#c9e3f1" opacity=".75"/>`+
       `<ellipse cx="${x+w/2}" cy="${y+5}" rx="${w*.45}" ry="5" fill="#ffffff" opacity=".35"/>`;
  });
  $("#bergs").innerHTML=b;
  const wave=(x0,y)=>`M${x0} ${y} q20 -10 40 0`+" t40 0".repeat(140);
  $("#wave1").setAttribute("d",wave(-2800,420));
  $("#wave2").setAttribute("d",wave(-2780,472));
  let s="";
  for(let i=0;i<34;i++){const x=-1400+Math.random()*3400,y=392+Math.random()*100;
    s+=`<ellipse class="twinkle" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${(4+Math.random()*6).toFixed(1)}" ry="1.6" style="animation-delay:${(Math.random()*2.6).toFixed(2)}s"/>`}
  $("#sparkles").innerHTML=s;
})();

/* ================= SCREENS ================= */
function show(s){
  state=s;document.body.className="s-"+s+(bigView&&s==="game"?" bigview":"");
  if(s!=="game"&&bigView){bigView=false;$("#bigBtn").textContent="🐧 Big view";$("#bigBtn").classList.remove("on")}
  requestAnimationFrame(()=>layoutWorld(true));
}

/* ================= HOME ================= */
const perRound=()=>names.length>3?Math.ceil(names.length/3):0;
function countOptions(){
  const max=allPics().length,s=new Set([6,8,10]),p=perRound();
  if(p>=2)s.add(p);
  return [...s].filter(c=>c<=max).sort((a,b)=>a-b);
}
function defaultCount(){const p=perRound(),o=countOptions();return o.includes(p)?p:(o.includes(8)?8:o[o.length-1]||6)}
let count=defaultCount();
function renderHome(){
  $("#classPill").textContent=`👧👦 ${names.length} student${names.length===1?"":"s"}`;
  const p=perRound(),max=allPics().length,opts=countOptions();
  if(!opts.includes(count))count=defaultCount();
  let h=!p?"Everyone answers together":
    p<=max?`${p} picture${p>1?"s":""} = every student gets 1 turn`:
    `${p} pictures needed for everyone — add more in ✏️ Edit`;
  const waiting=(turns.done.length&&turns.pool.length)?turns.pool.length:0;
  if(waiting&&p)h+=`<br>⏳ ${waiting} student${waiting>1?"s are":" is"} still waiting from last time`;
  $("#countHint").innerHTML=h;
  $("#countRow").innerHTML=opts.map(c=>`<button class="countBtn ${c===count?"sel":""} ${c===p?"fits":""}" data-c="${c}">${c}</button>`).join("");
}
$("#countRow").onclick=e=>{const b=e.target.closest("[data-c]");if(b){count=+b.dataset.c;sfx("click");renderHome()}};
$("#startBtn").onclick=()=>{ac();sfx("pop");speak("Let's help the penguin!");startGame()};
function goHome(){try{speechSynthesis.cancel()}catch(e){};clearTimers();setIce(.55);setPeng("hello");renderHome();show("home")}
$("#homeBtn").onclick=goHome;

/* ================= GAME STATE ================= */
let G={ice:.55};
let timers=[];
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function clearTimers(){timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[]}
const START_ICE=.25;

function startGame(){
  clearTimers();
  const pics=allPics();
  const hot=shuffle(pics.filter(p=>p.ans==="hot")), cold=shuffle(pics.filter(p=>p.ans==="cold"));
  const half=Math.ceil(count/2);
  let qs=hot.slice(0,half).concat(cold.slice(0,count-half));
  if(qs.length<count){const rest=shuffle(pics.filter(p=>!qs.includes(p)));qs=qs.concat(rest.slice(0,count-qs.length))}
  G={qs:shuffle(qs),qi:0,ice:START_ICE,mode:"main",group:[],bonus:shuffle(BONUS),bi:0,tries:0};
  setPeng("");setIce(G.ice);show("game");renderPick();
}
const step=()=>(1-START_ICE)/G.qs.length;
function setIce(v){
  G.ice=Math.max(.1,Math.min(1,v));
  $("#iceG").style.transform=`scale(${.45+G.ice*1.95},${.7+G.ice*1.5})`;
  $("#sunG").style.transform=`scale(${1.35-G.ice*.75})`;
  $("#iceFill").style.width=(G.ice*100)+"%";
  $("#heat").setAttribute("opacity",((1-G.ice)*.38).toFixed(2));
  $("#cracks").setAttribute("opacity",G.ice<.45?1:0);
  $("#puddles").setAttribute("opacity",Math.max(0,(.6-G.ice)*1.6).toFixed(2));
  $("#peng").classList.toggle("hot",G.ice<.35);
}
function setPeng(c){const p=$("#peng");p.classList.remove("clap","worry","dance","hello","boing");void p.getBBox();if(c)p.classList.add(c)}
function drip(n=7){
  const r=$("#iceG").getBoundingClientRect(),fx=$("#fx");
  for(let i=0;i<n;i++){const d=document.createElement("span");d.className="drop";d.textContent="💧";
    d.style.left=(r.left+r.width*(.1+Math.random()*.8))+"px";d.style.top=(r.top+r.height*.25)+"px";d.style.animationDelay=(i*.09)+"s";
    fx.appendChild(d);setTimeout(()=>d.remove(),1900)}
}
function snow(n,chars){
  const f=freeR||{x:0,w:innerWidth},fx=$("#fx");
  for(let i=0;i<n;i++){const s=document.createElement("span");s.className="flake";s.textContent=chars[i%chars.length];
    s.style.left=(f.x+Math.random()*f.w*.95)+"px";s.style.animationDuration=(1.8+Math.random()*1.6)+"s";s.style.animationDelay=(Math.random()*.6)+"s";s.style.fontSize=(1.4+Math.random()*1.2)+"rem";
    fx.appendChild(s);setTimeout(()=>s.remove(),4300)}
}
function fishJump(which){
  const f=$(which==="L"?"#fishL":"#fishR");f.classList.remove("jump");void f.getBBox();f.classList.add("jump");
  setTimeout(()=>sfx("splash"),1050);
}
$("#peng").addEventListener("click",()=>{sfx("squeak");setPeng("boing")});

/* ----- picker: no repeats, saved between games; the last group is filled to 3 from the next round ----- */
function nextGroup(){
  const list=names;
  if(list.length<=3) return list.slice();
  if(!turns.pool.length){turns.pool=shuffle(list);turns.done=[]}
  let grp=turns.pool.splice(0,3);
  if(grp.length<3){
    const next=shuffle(list.filter(n=>!grp.includes(n)));
    const extra=next.splice(0,3-grp.length);
    grp=grp.concat(extra);turns.pool=next;turns.done=extra.slice();
    later(()=>toast("🎉 Everyone has had a turn! Starting a new round of turns."),900);
  }else{
    turns.done.push(...grp);
    if(!turns.pool.length) later(()=>toast("🎉 Everyone has had a turn!"),900);
  }
  saveTurns();
  return grp;
}
function turnsHTML(){
  if(names.length<=3) return "";
  const done=new Set(turns.done);
  return `<div class="turns">${names.map(n=>`<span class="${done.has(n)?"done":""}">${esc(n)}</span>`).join("")}</div>`;
}
function progress(){
  if(G.mode==="main") $("#progPill").textContent=`🖼️ ${Math.min(G.qi+1,G.qs.length)} / ${G.qs.length}`;
  else $("#progPill").textContent=`🌍 Bonus ${Math.min(G.bi+1,G.bonus.length)} / ${G.bonus.length}`;
}

/* ----- MAIN ROUND ----- */
function renderPick(){
  progress();setPeng("");
  $("#panel").innerHTML=`
    <div class="who" id="who"></div>
    <div class="card"><span class="wait">❓</span></div>
    <div class="prompt">Who will help the penguin?</div>
    <div class="ctrl"><button class="btn pickBtn" id="pickBtn">🎲 Pick!</button></div>
    ${turnsHTML()}`;
  $("#pickBtn").onclick=doPick;
}
function doPick(){
  const list=names;
  $("#pickBtn").disabled=true;
  const who=$("#who");
  if(list.length<=3){sfx("pop");showQuestion(list.length?list.slice():["Everyone"]);return}
  let t=0;
  const iv=setInterval(()=>{
    const s=shuffle(list).slice(0,3);
    who.innerHTML=s.map(n=>`<span class="chip spin">${esc(n)}</span>`).join("");
    if(t%2===0)sfx("tick");
    if(++t>14){clearInterval(iv);sfx("pop");G.group=nextGroup();showQuestion(G.group)}
  },85);
  timers.push(iv);
}
function showQuestion(group){
  const q=G.qs[G.qi];G.tries=0;
  $("#panel").innerHTML=`
    <div class="who">${group.map((n,i)=>`<span class="chip${n==="Everyone"?" all":""}" style="animation-delay:${i*.15}s">${esc(n)}</span>`).join("")}</div>
    <div class="card reveal">${artHTML(q)}<button class="replay" id="replay" title="Say it again">🔊</button><span class="cap">${esc(q.name)}</span></div>
    <div class="prompt" id="prompt">Is it hot or cold?</div>
    <div class="ctrl" id="ctrl"><button class="btn speakBtn" id="speakBtn">🎤 Speak!</button></div>
    ${turnsHTML()}`;
  const ask=()=>speak("Is it hot, or cold?");
  $("#replay").onclick=ask;
  later(ask,650);
  $("#speakBtn").onclick=()=>{
    sfx("click");
    $("#prompt").innerHTML=`<div class="speakBanner">🎤 Say: “It is hot.” or “It is cold.”</div>`;
    $("#ctrl").innerHTML=`<button class="btn hotBtn" data-a="hot">🔥 Hot</button><button class="btn coldBtn" data-a="cold">❄️ Cold</button>`;
    $("#ctrl").onclick=e=>{const b=e.target.closest("[data-a]");if(b)answer(b.dataset.a,b)};
  };
}
function answer(a,btn){
  const q=G.qs[G.qi], ok=a===q.ans, word=q.ans, icon=word==="hot"?"🔥":"❄️";
  if(!ok&&G.tries===0){                       // first miss: let them try again
    G.tries=1;sfx("hmm");setPeng("worry");drip(3);
    btn.classList.remove("nope");void btn.offsetWidth;btn.classList.add("nope");
    later(()=>speak("Hmm. Try again! Is it hot, or cold?"),300);
    $("#prompt").innerHTML=`<div class="feedback try">Try again! 🤔<span class="zh">Is it like fire 🔥 or like ice 🧊?</span></div>`;
    return;
  }
  $("#ctrl").onclick=null;
  if(ok){
    setIce(G.ice+(G.tries?step()*.6:step()));setPeng("clap");sfx("good");
    snow(word==="cold"?10:7,word==="cold"?["❄️","❄️","⭐"]:["⭐","❄️"]);
    fishJump(Math.random()<.5?"L":"R");
    later(()=>speak(`${G.tries?"You got it!":"Yes!"} It is ${word}!`),350);
    $("#prompt").innerHTML=`<div class="feedback ok">${G.tries?"You got it!":"Great!"} It is ${word}! ${icon}</div>`;
  }else{
    setIce(G.ice-step());setPeng("worry");drip();sfx("oops");
    later(()=>speak(`It is ${word}. Let's say it together. It is ${word}.`),400);
    $("#prompt").innerHTML=`<div class="feedback no">It is ${word}. ${icon}<span class="say">Let’s say it: “It is ${word}.”</span></div>`;
  }
  const last=G.qi>=G.qs.length-1;
  $("#ctrl").innerHTML=`<button class="btn nextBtn" id="nextBtn">${last?"Finish 🎉":"Next ▶"}</button>`;
  $("#nextBtn").onclick=()=>{sfx("click");if(last) mainEnd(); else {G.qi++;renderPick()}};
}
function celebrate(chars){
  setIce(1);setPeng("dance");sfx("win");snow(26,chars);
  fishJump("L");later(()=>fishJump("R"),700);later(()=>fishJump("L"),1500);
  setBig(true);later(()=>setBig(false),4200);   // the penguin gets the whole screen for a moment
}
function mainEnd(){
  celebrate(["❄️","⭐","🎉","❄️"]);
  later(()=>speak("Hooray! You saved the penguin!"),500);
  $("#progPill").textContent="🎉 Done!";
  $("#panel").innerHTML=`<div class="endBox">
    <h2>You saved the penguin!</h2>
    <p>No more water! The ice is big again! 🧊🐧</p>
    <div style="height:.5rem"></div>
    <div class="prompt">🌍 Bonus Round: Help the penguin’s home!<span class="zh">保護企鵝的家!</span></div>
    <div class="ctrl"><button class="btn goodBtn" id="toBonus">Bonus Round ▶</button></div>
    <button class="linkBtn" id="skipBonus">Skip bonus</button>
  </div>`;
  $("#toBonus").onclick=()=>{sfx("click");clearTimers();setBig(false);G.mode="bonus";G.bi=0;renderBonus()};
  $("#skipBonus").onclick=()=>{clearTimers();finalEnd()};
}

/* ----- BONUS ROUND (bilingual, whole class) ----- */
function renderBonus(){
  progress();setPeng("");G.tries=0;
  const b=G.bonus[G.bi];
  $("#panel").innerHTML=`
    <div class="who"><span class="chip all">Everyone! 大家一起!</span></div>
    <div class="card bonusCard reveal"><button class="replay" id="replay" title="Say it again">🔊</button><span class="art">${b.emoji}</span><span class="cap">${esc(b.en)}<span class="zh">${esc(b.zh)}</span></span></div>
    <div class="prompt" id="prompt">Good or bad for the Earth?<span class="zh">對地球好不好?</span></div>
    <div class="ctrl" id="ctrl"><button class="btn speakBtn" id="speakBtn">🎤 Speak!</button></div>`;
  const ask=()=>speak(`${b.en}. Good, or bad?`);
  $("#replay").onclick=ask;
  later(ask,600);
  $("#speakBtn").onclick=()=>{
    sfx("click");
    $("#prompt").innerHTML=`<div class="speakBanner">🎤 Say: “Good!” or “Bad!”</div>`;
    $("#ctrl").innerHTML=`<button class="btn goodBtn" data-a="1">👍 Good <small>好</small></button><button class="btn badBtn" data-a="0">👎 Bad <small>不好</small></button>`;
    $("#ctrl").onclick=e=>{const x=e.target.closest("[data-a]");if(x)bonusAnswer(x.dataset.a==="1",x)};
  };
}
function bonusAnswer(saidGood,btn){
  const b=G.bonus[G.bi], ok=saidGood===b.good;
  if(!ok&&G.tries===0){
    G.tries=1;sfx("hmm");setPeng("worry");
    btn.classList.remove("nope");void btn.offsetWidth;btn.classList.add("nope");
    later(()=>speak(`Hmm. Try again! ${b.en}. Good, or bad?`),300);
    $("#prompt").innerHTML=`<div class="feedback try">Try again! 🤔<span class="zh">再想一想!</span></div>`;
    return;
  }
  $("#ctrl").onclick=null;
  const en=b.good?"Good for the Earth!":"Bad for the Earth.";
  const zh=b.good?"對地球很好!":"對地球不好。";
  if(ok){setPeng("clap");sfx("good");snow(8,b.good?["💚","🌱","⭐"]:["⭐","💚"]);later(()=>speak(b.good?"Yes! Good for the Earth!":"Yes! That is bad for the Earth."),350)}
  else{setPeng("worry");sfx("oops");later(()=>speak(`It is ${b.good?"good":"bad"} for the Earth.`),400)}
  $("#prompt").innerHTML=`<div class="feedback ${ok?"ok":"no"}">${ok?(G.tries?"You got it!":"Yes!"):""} ${b.good?"👍":"👎"} ${en}<span class="zh">${zh}</span></div>`;
  const last=G.bi>=G.bonus.length-1;
  $("#ctrl").innerHTML=`<button class="btn nextBtn" id="nextBtn">${last?"Finish 🎉":"Next ▶"}</button>`;
  $("#nextBtn").onclick=()=>{sfx("click");if(last) finalEnd(); else {G.bi++;renderBonus()}};
}
function finalEnd(){
  celebrate(["💚","❄️","⭐","🌍","🎉"]);
  later(()=>speak("Thank you for saving my home!"),500);
  $("#progPill").textContent="🎉 Done!";
  $("#panel").innerHTML=`<div class="endBox">
    <div class="theEnd">~ The End ~</div>
    <h2>Thank you for saving my home!</h2>
    <div class="zh">謝謝你保護我的家!</div>
    <p>🐧💚🌍</p>
    <div class="ctrl">
      <button class="btn goodBtn" id="again">🔁 Play again</button>
      <button class="btn nextBtn" id="home2">🏠 Home</button>
    </div></div>`;
  $("#again").onclick=()=>{sfx("pop");setBig(false);startGame()};
  $("#home2").onclick=goHome;
}

/* ================= SETTINGS ================= */
$("#openSettings").onclick=()=>{fillNames();renderPicGrid();show("settings")};
$("#closeSettings").onclick=()=>{renderHome();show("home")};
document.querySelector(".tabs").onclick=e=>{
  const t=e.target.closest("[data-tab]");if(!t)return;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("sel",x===t));
  $("#tabNames").style.display=t.dataset.tab==="names"?"":"none";
  $("#tabPics").style.display=t.dataset.tab==="pics"?"":"none";
};
function turnNote(){
  const d=turns.done.length,p=turns.pool.length;
  $("#turnNote").textContent=(d&&p)?`This round of turns: ${d} done, ${p} still waiting.`:"";
}
function fillNames(){$("#n1").value=names.join("\n");turnNote()}
$("#saveNames").onclick=()=>{
  const raw=$("#n1").value.split(/\n|,/).map(s=>s.trim()).filter(Boolean);
  const fixed=uniqueNames(raw), renamed=fixed.some((n,i)=>n!==raw[i]);
  const changed=fixed.join("\n")!==names.join("\n");
  names=fixed;$("#n1").value=names.join("\n");
  if(changed){resetTurns();count=defaultCount()}
  const ok=save("penguin_class_names",names);
  toast(renamed?"Saved ✅ Same names got a number so each student gets a turn.":ok?"Names saved ✅":"Names updated (couldn't save for next time)");
  turnNote();
};
$("#resetNames").onclick=()=>{names=DEFAULT_NAMES.slice();save("penguin_class_names",names);resetTurns();count=defaultCount();fillNames();toast("Names reset ✅")};
$("#resetTurns").onclick=()=>{resetTurns();turnNote();toast("Turns start over ✅ Everyone is waiting for a turn.")};

function resizeImage(file,cb){
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{
    const m=520,s=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.8));
  };img.onerror=()=>toast("Sorry, that picture couldn't be opened.");img.src=r.result};
  r.readAsDataURL(file);
}
function renderPicGrid(){
  const base=BASE_PICS.map(p=>{const img=picStore.over[p.id];return `<div class="pcard">
    <div class="pthumb">${img?`<img src="${img}" alt="">`:p.emoji}${p.steam?steamHTML():""}</div>
    <div class="pname">${esc(p.name)}</div><span class="tag ${p.ans}">${p.ans}</span>
    <div class="pbtns"><label for="f_${p.id}">📷 Photo</label><input type="file" accept="image/*" id="f_${p.id}" data-over="${p.id}">
    ${img?`<button data-reset="${p.id}">↺ Drawing</button>`:""}</div></div>`}).join("");
  const added=picStore.added.map((p,i)=>`<div class="pcard">
    <div class="pthumb"><img src="${p.img}" alt=""></div>
    <div class="pname">${esc(p.name)}</div><span class="tag ${p.ans}">${p.ans}</span>
    <div class="pbtns"><button data-del="${i}">🗑 Remove</button></div></div>`).join("");
  $("#picGrid").innerHTML=added+base;
}
$("#picGrid").onchange=e=>{
  const inp=e.target.closest("[data-over]");if(!inp||!inp.files[0])return;
  resizeImage(inp.files[0],url=>{picStore.over[inp.dataset.over]=url;savePics();renderPicGrid();toast("Photo added ✅")});
};
$("#picGrid").onclick=e=>{
  const r=e.target.closest("[data-reset]"),d=e.target.closest("[data-del]");
  if(r){delete picStore.over[r.dataset.reset];savePics();renderPicGrid()}
  if(d){picStore.added.splice(+d.dataset.del,1);savePics();renderPicGrid()}
};
let newAns="hot";
document.querySelector(".hc").onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;newAns=b.dataset.v;document.querySelectorAll(".hc button").forEach(x=>x.classList.toggle("sel",x===b))};
$("#newFile").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const nm=$("#newName").value.trim();
  if(!nm){toast("Type a name for the picture first 🙂");e.target.value="";return}
  resizeImage(f,url=>{picStore.added.unshift({id:"u"+Date.now(),name:nm,ans:newAns,img:url});savePics();$("#newName").value="";e.target.value="";renderPicGrid();toast("Picture added ✅")});
};

/* ================= SIZING ================= */
function fit(){
  const W=innerWidth,H=innerHeight,portrait=H>W;
  const z=Math.max(.72,Math.min(2.4,portrait?Math.min(W/760,H/1100):Math.min(W/1366,H/768)));
  root.style.setProperty("--z",z.toFixed(3));
  layoutWorld(false);
}
addEventListener("resize",fit);

setIce(.55);setPeng("hello");renderHome();fit();
</script>
</body>
